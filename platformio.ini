; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
; Mostra no monitor o que voce digita (sem isso, os comandos ficam invisiveis).
monitor_echo = yes
; Historico: "time" poe a hora no inicio de cada linha e "log2file" salva TUDO
; que aparece no monitor em logs/device-monitor-AAMMDD-HHMMSS.log (um arquivo
; por vez que o monitor e aberto). Pode fechar o monitor sem perder nada.
monitor_filters = default, time, log2file

; Porta USB do ESP32 no Mac. O "*usb*" pega os nomes que o macOS da para os
; chips USB das placas ESP32 (cu.usbserial-XXXX, cu.wchusbserial-XXXX,
; cu.usbmodemXXXX) e ignora portas Bluetooth, como fones de ouvido.
; Se tiver duas placas ligadas, troque pelo nome exato (veja com: pio device list).
upload_port = /dev/cu.*usb*
monitor_port = /dev/cu.*usb*
; Desliga as mensagens internas do ESP32 ([E][vfs_api.cpp]...): no monitor so
; aparecem as mensagens do projeto, em portugues.
build_flags = -DCORE_DEBUG_LEVEL=0
lib_deps =
    adafruit/Adafruit AS7341
    bblanchon/ArduinoJson@^7
